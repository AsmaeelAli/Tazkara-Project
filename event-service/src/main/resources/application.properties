spring.application.name=event-service
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}


rabbitmq.exchange=${RABBITMQ_EXCHANGE}
rabbitmq.queue.availability-changed=${RABBITMQ_AVAILABILITY_CHANGED_QUEUE}

rabbitmq.routing-key.availability-changed=${RABBITMQ_AVAILABILITY_CHANGED_KEY}


app.jwt.secret=${JWT_SECRET}
api.service-key=${API_SERVICE_KEY}
booking.base-url=${BOOKING_BASE_URL}

logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.security=DEBUG
