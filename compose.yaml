name: tazkara

x-booking-base: &booking-base
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SERVICE_MODULE: booking-service
  restart: unless-stopped
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/booking_db
    DB_USER: ${DB_USER:?DB_USER is required}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    API_SERVICE_KEY: ${API_SERVICE_KEY:?API_SERVICE_KEY is required}
    EVENT_BASE_URL: http://event-service:8082
    BATCH_SIZE: ${BATCH_SIZE:?BATCH_SIZE is required}
    REFERENCE_RANDOM_SIZE: ${REFERENCE_RANDOM_SIZE:?REFERENCE_RANDOM_SIZE is required}
    BOOKING_HOLD_DURATION: ${BOOKING_HOLD_DURATION:?BOOKING_HOLD_DURATION is required}
    BOOKING_EXPIRY_INTERVAL: ${BOOKING_EXPIRY_INTERVAL:?BOOKING_EXPIRY_INTERVAL is required}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: "5672"
    RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Required}
    RABBITMQ_EVENT_PUBLISHED_QUEUE: ${RABBITMQ_EVENT_PUBLISHED_QUEUE:?Required}
    RABBITMQ_EVENT_CANCELLED_QUEUE: ${RABBITMQ_EVENT_CANCELLED_QUEUE:?Required}
    RABBITMQ_EVENT_PUBLISHED_KEY: ${RABBITMQ_EVENT_PUBLISHED_KEY:?Required}
    RABBITMQ_EVENT_CANCELLED_KEY: ${RABBITMQ_EVENT_CANCELLED_KEY:?Required}
    RABBITMQ_AVAILABILITY_CHANGED_KEY: ${RABBITMQ_AVAILABILITY_CHANGED_KEY:?Required}
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    container_name: tazkara-postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    container_name: tazkara-rabbitmq
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    container_name: tazkara-identity-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_SERVICE_KEY: ${API_SERVICE_KEY:?API_SERVICE_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    container_name: tazkara-event-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: event-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/event_db
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      API_SERVICE_KEY: ${API_SERVICE_KEY:?API_SERVICE_KEY is required}

      BOOKING_BASE_URL: http://booking-service:8083

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:?Required}
      RABBITMQ_AVAILABILITY_CHANGED_QUEUE: ${RABBITMQ_AVAILABILITY_CHANGED_QUEUE:?Required}
      RABBITMQ_AVAILABILITY_CHANGED_KEY: ${RABBITMQ_AVAILABILITY_CHANGED_KEY:?Required}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking-service:
    <<: *booking-base
    container_name: tazkara-booking-service-1
    ports:
      - "8083:8083"

  booking-service-2:
    <<: *booking-base
    container_name: tazkara-booking-service-2
    ports:
      - "8084:8083"

  booking-service-3:
    <<: *booking-base
    container_name: tazkara-booking-service-3
    ports:
      - "8085:8083"

  api-gateway-service:
    container_name: tazkara-api-gateway-service
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: api-gateway-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - event-service
      - booking-service

volumes:
  postgres_data:
    name: tazkara-postgres-data
  rabbitmq_data:
    name: tazkara-rabbitmq-data