
spring:
  application:
    name: api-gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Identity Service
            - id: identity-auth
              uri: http://identity-service:8081
              predicates:
                - Path=/auth/**

            - id: identity-api
              uri: http://identity-service:8081
              predicates:
                - Path=/api,/api/**

            # Event Service
            - id: event-management
              uri: http://event-service:8082
              predicates:
                - Path=/api/events,/api/events/**

            - id: public-events
              uri: http://event-service:8082
              predicates:
                - Path=/api/public/events,/api/public/events/**

            - id: ticket-types
              uri: http://event-service:8082
              predicates:
                - Path=/api/tickets,/api/tickets/**

            # Swagger Documentation
            - id: identity-swagger
              uri: http://identity-service:8081
              predicates:
                - Path=/identity/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: event-swagger
              uri: http://event-service:8082
              predicates:
                - Path=/event/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

            - id: booking-swagger
              uri: http://booking-service:8083
              predicates:
                - Path=/booking/v3/api-docs
              filters:
                - SetPath=/v3/api-docs

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Identity Service
        url: /identity/v3/api-docs

      - name: Event Service
        url: /event/v3/api-docs

      - name: Booking Service
        url: /booking/v3/api-docs
