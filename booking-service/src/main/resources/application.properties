spring.application.name=booking-service
server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

rabbitmq.queue.event-published=booking.event-published.queue
rabbitmq.queue.event-cancelled=booking.event-cancelled.queue

app.jwt.secret=${JWT_SECRET}
api.service-key=${API_SERVICE_KEY}

booking.tickets.batch-size=${BATCH_SIZE}
booking.hold-duration=${BOOKING_HOLD_DURATION}
booking.expiry.interval=${BOOKING_EXPIRY_INTERVAL}

event.base-url=${EVENT_BASE_URL}

reference.random.size=${REFERENCE_RANDOM_SIZE}

logging.level.org.springframework.security=DEBUG